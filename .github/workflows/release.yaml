name: Release

# 最小注入发布流程（对齐 Kazumi：源码留空 + CI secrets 注入产物）。
# 触发：推送 v* 标签（如 v1.1.3）。
# 凭证：仓库 Settings → Secrets 配置 DANDANAPI_APPID / DANDANAPI_KEY /
#       GH_TOKEN（用于 electron-builder 自动发布到 GitHub Releases）。
# 未设置 DANDANAPI_* 时 afterPack 自动跳过注入，打包副本保持 ''（用户本地自配）。

on:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer (afterPack 注入 DanDanPlay 凭证)
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:win

      - name: Upload build artifacts (GH_TOKEN 缺失时的兜底)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellaflix-win
          path: dist/*
          retention-days: 30
